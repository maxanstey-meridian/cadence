version: "3"

vars:
  SOLUTION: "{{.ROOT_DIR}}/Cadence.slnx"

tasks:
  prepare:
    cmds:
      - "{{.ROOT_DIR}}/scripts/pack-tandem.sh"

  build:
    cmds:
      - dotnet build {{.SOLUTION}}

  test:
    cmds:
      - dotnet test {{.SOLUTION}}

  run:
    deps: [prepare]
    cmds:
      - dotnet restore {{.SOLUTION}} --force-evaluate
      - dotnet run --no-restore --project {{.ROOT_DIR}}/src/Cadence.Host -- run {{.CLI_ARGS}}

  install:
    deps: [prepare]
    cmds:
      - dotnet restore {{.SOLUTION}} --force-evaluate
      - dotnet pack {{.ROOT_DIR}}/src/Cadence.Host --no-restore --configuration Release --output {{.ROOT_DIR}}/packages
      - sh -c 'dotnet tool list --global | grep -q "^cadence.tool " && dotnet tool uninstall --global Cadence.Tool || true'
      - dotnet tool install --global --add-source "{{.ROOT_DIR}}/packages" Cadence.Tool --version 0.1.1-local

  format:
    cmds:
      - dotnet tool restore
      - dotnet csharpier format .
      - dotnet format {{.SOLUTION}} analyzers --severity warn

  format:check:
    cmds:
      - dotnet tool restore
      - dotnet csharpier check .
      - dotnet format {{.SOLUTION}} analyzers --severity warn --verify-no-changes --verbosity minimal

  architecture:check:
    cmds:
      - ~/Sites/plumb/plumb . --json

  check:
    cmds:
      - task: prepare
      - dotnet restore {{.SOLUTION}} --force-evaluate
      - task: format:check
      - task: test
      - task: build
      - task: architecture:check
